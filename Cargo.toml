[workspace]
members = ["crates/melos-core", "crates/melos-cli", "crates/melos-tui"]
default-members = ["crates/melos-core", "crates/melos-cli"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[workspace.dependencies]
# Serialization / Config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
yaml_serde = "0.10.4"

# File system
glob = "0.3.3"

# Async runtime
tokio = { version = "1.52.1", features = ["full"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Parallel iteration
rayon = "1.12.0"

# Regex for pubspec parsing
regex = "1.12.3"

# Semver for version management
semver = "1.0.28"

# Path utilities
pathdiff = "0.2.3"

# File watching
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

# CLI
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.2"

# Terminal output
colored = "3.1.1"
indicatif = "0.18.4"

# TUI
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"

# Dev
tempfile = "3.27.0"
assert_cmd = "2.2.1"
predicates = "3.1.4"

# Internal
melos-core = { path = "crates/melos-core" }
