[workspace]
members = ["crates/melos-core", "crates/melos-cli", "crates/melos-tui"]
default-members = ["crates/melos-core", "crates/melos-cli"]
resolver = "3"

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[workspace.dependencies]
# Serialization / Config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
yaml_serde = "0.10.4"

# File system
glob = "0.3.3"

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Parallel iteration
rayon = "1.12.0"

# Regex for pubspec parsing
regex = "1.12.3"

# Semver for version management
semver = "1.0.28"

# Path utilities
pathdiff = "0.2.3"

# HTTP client (pub server lookups)
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json"] }

# File watching
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

# CLI
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"

# Terminal output
colored = "3.1.1"
indicatif = "0.18.4"

# TUI
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"

# Dev
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Internal
melos-core = { path = "crates/melos-core" }

[workspace.lints.clippy]
# Enable pedantic as warnings (promoted to deny by CI clippy invocation)
pedantic = { level = "warn", priority = -1 }

# Allow doc-related pedantic lints (CLI app, not a published library)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

# Allow style-level pedantic lints that add noise without safety benefit
unnecessary_wraps = "allow"
implicit_hasher = "allow"
struct_excessive_bools = "allow"
items_after_statements = "allow"
similar_names = "allow"
too_many_lines = "allow"
fn_params_excessive_bools = "allow"
unreadable_literal = "allow"
doc_link_with_quotes = "allow"
